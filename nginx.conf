server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Redirects (e.g. /about -> /about/) must stay relative, never include :8080.
    # A request for a page without its trailing slash gets a 301 to the slash URL (try_files $uri/).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # One host only: www.sthithaquantum.com is a duplicate of the site, so send it to the apex domain.
    if ($host = www.sthithaquantum.com) {
        return 301 https://sthithaquantum.com$request_uri;
    }

    # /blog is an old alias for Insights.
    location = /blog { return 301 /research/insights/; }
    location = /blog/ { return 301 /research/insights/; }
    location ~ ^/blog/([a-z0-9-]+)/?$ { return 301 /research/insights/$1/; }

    location / {
        # Always revalidate HTML so visitors never get a stale copy of the site.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Strict-Transport-Security "max-age=31536000";
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    error_page 404 /404.html;
}
